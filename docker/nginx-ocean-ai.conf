# ============================================
# Ocean Assistant (Next.js, basePath=/ocean-ai)
# Docker container on 127.0.0.1:3130 (docker/deploy.sh)
# ============================================
# Paste inside the `server { listen 443 ssl; ... }` block of /etc/nginx/conf.d/apache.conf.
#
# No `location = /ocean-ai { return 301 /ocean-ai/; }` here: Next redirects /ocean-ai/ to
# /ocean-ai, so that redirect would loop. This prefix matches both. Its assets are under
# /ocean-ai/_next/, so they don't clash with the server's existing /_next/ location.
location ^~ /ocean-ai {
    proxy_pass http://127.0.0.1:3130;   # no trailing slash: the app expects the /ocean-ai prefix
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 60s;
    proxy_read_timeout    60s;
}
